name: Fetch News and Redeploy

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run fetch-news script
        run: npm run fetch-news
        env:
          NODE_ENV: production

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/sources.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update news articles [skip ci]"
            git push
          fi

      - name: Trigger Vercel redeploy
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          else
            echo "VERCEL_DEPLOY_HOOK_URL not set, skipping Vercel redeploy trigger"
          fi

