name: Fetch Funds and Rates

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 17:00 Asia/Dhaka, daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-funds-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run fetch-funds script
        run: npm run fetch:funds
        env:
          NODE_ENV: production

      - name: Run fetch-rates script
        run: npm run fetch:rates
        env:
          NODE_ENV: production

      - name: Commit updated data files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/funds.json src/data/sonchayapatra.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update fund and rate data [skip ci]"
            git push
          fi
